# Jenkins local pour le TP : docker compose -f docker-compose.jenkins.yml up -d --build
# -> http://localhost:8081  (8080 est déjà pris par l'application InclusiVenue)
name: jenkins
services:
  jenkins:
    build: ./jenkins
    user: root            # nécessaire pour accéder au socket Docker (acceptable en local, pas en production)
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home: