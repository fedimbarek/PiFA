# InclusiVenue — full stack
#   Start : docker compose up --build -d     → http://localhost:8080 (API docs: http://localhost:8080/api-docs)
#   Stop  : docker compose down              (keeps the database volume)
#   Never use `down -v` unless you really want to delete all data.
name: inclusivenue

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/inclusivenue
      # Local demo default only. Set a random >= 32-char JWT_SECRET in .env before deploying.
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-CHANGE-ME-before-any-deployment-0123456789}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_MODE: ${MAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-InclusiVenue <no-reply@inclusivenue.tn>}
      SEED_ON_START: ${SEED_ON_START:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads:
