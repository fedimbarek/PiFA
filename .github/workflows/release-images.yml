name: Release images

# Builds and pushes images to GitHub Container Registry when a version tag is pushed (git tag v1.0.0 && git push --tags).
# Deployment itself (Render / Railway / VPS) is described in deliverables/DEPLOYMENT.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inclusivenue-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/inclusivenue-${{ matrix.service }}:latest
      - name: Trigger Render deploy hook (optional)
        if: matrix.service == 'backend' && env.RENDER_DEPLOY_HOOK != ''
        env: { RENDER_DEPLOY_HOOK: '${{ secrets.RENDER_DEPLOY_HOOK }}' }
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
